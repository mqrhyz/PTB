name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://cola-photobooth.pages.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install deployment tools
        run: npm ci
      - name: Validate JavaScript
        run: npm run check
      - name: Preserve existing site download routes
        run: |
          mkdir -p .deployment
          npx wrangler r2 object get cola-ptb-updates/deployment/pages-worker.js --file .deployment/worker.js --remote
          curl --fail --silent --show-error --retry 3 https://cola-photobooth.pages.dev/android/update.json -o .deployment/update.json
          npm run prepare:deploy
      - name: Deploy production website
        run: npx wrangler pages deploy .deploy --project-name cola-photobooth --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Record deployment
        run: |
          echo 'Website: https://cola-photobooth.pages.dev' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
